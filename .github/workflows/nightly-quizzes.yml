name: Generate quizzes

on:
  schedule:
    - cron: '17 11 * * *'   # daily, around 3-4 AM Pacific
  workflow_dispatch:         # lets you run it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: scripts/dataGenerator/cache
          key: quiz-data-cache-${{ github.run_id }}
          restore-keys: quiz-data-cache-

      - name: Generate quizzes for the next 7 days
        run: node scripts/dataGenerator/runDailyQuiz.js 7
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}