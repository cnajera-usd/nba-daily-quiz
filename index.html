    <meta name="description" content="Daily NBA trivia quiz. 10 questions, every day." />
    <title>NBA Daily Quiz</title>
        <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('nba-quiz-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>    <script>
